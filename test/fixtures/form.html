<!doctype html><title>Form</title><form onsubmit="event.preventDefault();window.clicks=(window.clicks||0)+1;history.pushState({},'','?done');document.body.innerHTML='<h1>Thank you for applying</h1>'">
<label for=fn>First Name *</label><input id=fn required><label for=ln>Last Name *</label><input id=ln required><label for=em>Email *</label><input id=em type=email required>
<label for=res>Resume *</label><input id=res type=file required>
<label for=why>Why do you want to work at our company? *</label><textarea id=why required></textarea>
<label for=sp>Will you now or in the future require sponsorship? *</label><select id=sp required><option value="">Select...</option><option value=1>Yes</option><option value=0>No</option></select>
<fieldset><legend>Are you legally authorized to work here? *</legend><label><input type=radio name=auth value=y required> Yes</label><label><input type=radio name=auth value=n> No</label></fieldset>
<label for=vet>Veteran status</label><select id=vet><option value="">Choose</option><option value=a>I am a veteran</option><option value=b>I prefer not to say</option></select>
<button type=button id=dd aria-haspopup=listbox aria-controls=ddl aria-label="Degree Select One Required" onclick="ddl.hidden=false">Select One</button><ul id=ddl role=listbox hidden><li role=option onclick="dd.innerText='Bachelor\'s Degree';ddl.hidden=true">Bachelor's Degree</li><li role=option>Master's Degree</li></ul>
<label><input type=checkbox id=priv required> I agree to the privacy policy *</label><label><input type=checkbox id=mk> Send me marketing</label>
<input type=password id=pw style="display:none"><button>Submit application</button></form>
